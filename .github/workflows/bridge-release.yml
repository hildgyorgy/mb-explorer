name: Release macOS Bridge

on:
  push:
    tags:
      - 'bridge-v*'

permissions:
  contents: read

concurrency:
  group: bridge-release-${{ github.ref }}

jobs:
  release:
    runs-on: macos-15
    environment: bridge-release
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate release tag and test
        shell: bash
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^bridge-v([0-9]+\.[0-9]+\.[0-9]+)$ ]]
          version="${BASH_REMATCH[1]}"
          git merge-base --is-ancestor HEAD origin/main
          test "$(uname -m)" = arm64
          test "$version" = "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' tools/upnp-bridge/macos/Info.plist)"
          grep -Fx "BRIDGE_VERSION = \"$version\"" tools/upnp-bridge/musicards_upnp_bridge.py
          printf 'BRIDGE_VERSION=%s\n' "$version" >> "$GITHUB_ENV"
          python3 -m unittest tools/test_upnp_discovery.py
          node tools/test-upnp-renderer-config.mjs
          node tools/test-navidrome-endpoint-selection.mjs
          node tools/test-navidrome-matching.mjs

      - name: Import Developer ID and build the DMG
        shell: bash
        env:
          CERTIFICATE_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
        run: |
          : "${CERTIFICATE_BASE64:?Missing Developer ID certificate}" "${CERTIFICATE_PASSWORD:?Missing certificate password}"
          certificate="$RUNNER_TEMP/bridge-signing.p12"
          keychain="$RUNNER_TEMP/bridge-signing.keychain-db"
          trap 'rm -f "$certificate"; security delete-keychain "$keychain" 2>/dev/null || true' EXIT
          keychain_password="$(openssl rand -hex 32)"
          printf '%s' "$CERTIFICATE_BASE64" | base64 -D > "$certificate"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain"
          identity="$(security find-identity -v -p codesigning "$keychain" | awk '/Developer ID Application:/ {print $2; exit}')"
          : "${identity:?No valid Developer ID Application identity}"
          unset CERTIFICATE_BASE64 CERTIFICATE_PASSWORD
          CODESIGN_IDENTITY="$identity" bash tools/upnp-bridge/macos/build_macos.sh
          dmg="tools/upnp-bridge/dist/MusicBrainz-Explorer-Bridge-$BRIDGE_VERSION-macOS-arm64.dmg"
          codesign --verify --strict --verbose=2 "$dmg"
          printf 'BRIDGE_DMG=%s\n' "$dmg" >> "$GITHUB_ENV"

      - name: Notarize and validate
        shell: bash
        env:
          NOTARY_KEY: ${{ secrets.APPLE_NOTARY_KEY }}
          NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.APPLE_NOTARY_ISSUER }}
        run: |
          : "${NOTARY_KEY:?Missing Apple API key}" "${NOTARY_KEY_ID:?Missing Apple key ID}" "${NOTARY_ISSUER:?Missing Apple issuer ID}"
          umask 077
          key="$(mktemp "$RUNNER_TEMP/bridge-notary.XXXXXXXX")"
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$NOTARY_KEY" > "$key"
          xcrun notarytool submit "$BRIDGE_DMG" --key "$key" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER" --wait
          xcrun stapler staple "$BRIDGE_DMG"
          xcrun stapler validate "$BRIDGE_DMG"
          spctl --assess --type open --context context:primary-signature --verbose=2 "$BRIDGE_DMG"

      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "$BRIDGE_DMG" --verify-tag \
            --title "MusicBrainz Explorer Bridge $BRIDGE_VERSION" --notes-from-tag
